[workspace]
members = [
  "crates/devfleet-cli",
  "crates/devfleet-core",
  "crates/devfleet-daemon",
  "crates/devfleet-plugin-sdk",
  "crates/devfleet-protocol",
  "crates/devfleet-state",
  "crates/devfleet-supervisor",
  "crates/devfleet-testkit",
  "plugins/process",
]
exclude = ["validation/ios-isolation"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/Charlisim/devfleet"
rust-version = "1.98"
version = "0.1.0"

[workspace.dependencies]
anyhow = "1.0.100"
clap = { version = "4.5.53", features = ["derive"] }
fs2 = "0.4.3"
nix = { version = "0.30.1", features = ["process", "signal", "socket", "user"] }
rusqlite = { version = "0.37.0", features = ["bundled"] }
semver = { version = "1.0.27", features = ["serde"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
thiserror = "2.0.17"
toml = "0.8.23"
uuid = { version = "1.18.1", features = ["serde", "v7"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"

[profile.dev]
debug = 1
